services:
  - type: web
    name: spectrashield-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_BACKEND
        value: in-memory
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://*.vercel.app
